<div class="container mt-4">
  <h1 class="mb-4 text-center">Lista de Especies</h1>

  <div class="d-flex align-items-center justify-content-between mb-3">

    <div class="me-2">
      <app-btn-agregar (click)="openModal()"></app-btn-agregar>
    </div>

    <div class="d-flex justify-content-center flex-grow-1">
      <div class="d-flex align-items-center gap-2" style="min-width: 320px; max-width: 600px; width: 50%;">
        <!-- aquí el hijo que ya tiene input + botón -->
        <app-filtro-busqueda [searchControl]="busquedaControl" (clear)="limpiarBusqueda()"
          placeholder="Buscar especie...">
        </app-filtro-busqueda>
      </div>
    </div>

  </div>

  <div *ngIf="!isLoading && (especies.length === 0 && !especies)" class="alert alert-info mt-3 text-center"
    style="width: 50%;">
    No existen especies registradas
  </div>

  <table class="w-100 mt-3" *ngIf="!errorMessage">

    <thead>
      <ng-container *ngIf="isLoading && !isFiltering; else headerReal">
        <tr>
          <th>
            <div class="skeleton-header"></div>
          </th>
          <th>
            <div class="skeleton-header"></div>
          </th>
          <th>
            <div class="skeleton-header"></div>
          </th>
        </tr>
      </ng-container>

      <ng-template #headerReal>
        <tr *ngIf="(!isLoading || isFiltering) && especies">
          <th>Nombre de especie</th>
          <th>Fecha de creación</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
    </thead>

    <tbody>

      <ng-container *ngIf="isLoading; else filasDatos">
        <tr *ngFor="let _ of skeletonRows">
          <td><p-skeleton height="1.5rem" width="100%"></p-skeleton></td>
          <td><p-skeleton height="1.5rem" width="100%"></p-skeleton></td>
          <td><p-skeleton height="1.5rem" width="100%"></p-skeleton></td>
        </tr>
      </ng-container>

      <ng-template #filasDatos>
        <tr *ngFor="let especie of especies">
          <td>{{ especie.especie }}</td>
          <td>{{ especie.fechaCreacion }}</td>
          <td>
            <app-btn-editar (clickEvent)="openModal(especie)"></app-btn-editar>
            <app-btn-eliminar (clickEvent)="borrarEspecie(especie.id)"></app-btn-eliminar>
          </td>
        </tr>
      </ng-template>

    </tbody>
  </table>

  <div *ngIf="!isLoading && errorMessage" class="alert alert-danger text-center mx-auto mt-2" style="width: 50%;">
    {{ errorMessage }}
  </div>

  <p *ngIf="!isLoading && especies.length === 0 && !errorMessage" class="alert alert-info mt-3 text-center"
    style="width: 50%;">
    No existen especies registradas
  </p>

  <app-modal *ngIf="showModal" [show]="showModal" [title]="selectedEspecie ? 'Editar especie' : 'Agregar especie'"
    (closed)="closeModal()">

    <app-especie-form [especie]="selectedEspecie" (guardado)="onSave()" (cancelar)="closeModal()">
    </app-especie-form>

  </app-modal>
