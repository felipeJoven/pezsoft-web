<div class="container mt-4">
  <h1 class="mb-4 text-center">Lista de Especies</h1>

  <div class="d-flex align-items-center justify-content-between mb-3">

    <div class="d-flex justify-content-between" style="min-width: 180px; margin-left: 150px;">
      <app-btn-agregar (click)="openModal()"></app-btn-agregar>
    </div>

    <div class="d-flex flex-wrap align-items-center justify-content-center gap-2 flex-grow-1">

      <div class="flex-grow-1" style="min-width: 250px; max-width: 350px; margin-right: 20px;">
        <app-filtro-busqueda [searchControl]="searchControl" (clear)="clearSearch()"
          placeholder="Buscar especie...">
        </app-filtro-busqueda>
      </div>

      <div>
        <app-btn-limpiar (click)="clearSearch()"></app-btn-limpiar>
      </div>

      <div class="d-flex justify-content-end" style="min-width: 180px;">
        <app-filtro-orden [data]="especies" campoTexto="especie" campoFecha="fechaCreacion" [resetSignal]="resetSort"
          (sortedData)="especies = $event">
        </app-filtro-orden>
      </div>

    </div>
  </div>

  <div *ngIf="!isLoading && errorMessage" class="alert alert-danger text-center mx-auto mt-2" style="width: 50%;">
    {{ errorMessage }}
  </div>

  <p *ngIf="!isLoading && especies.length === 0 && !errorMessage" class="alert alert-info text-center mx-auto mt-3 text-center"
    style="width: 50%;">
    No existen especies registradas
  </p>

  <div class="table-container">
    <table *ngIf="!errorMessage">

      <thead>
        <ng-container *ngIf="isLoading && !isFiltering; else headerReal">
          <tr>
            <th><div class="skeleton-header"></div></th>
            <th><div class="skeleton-header"></div></th>
            <th><div class="skeleton-header"></div></th>
          </tr>
        </ng-container>

        <ng-template #headerReal>
          <tr *ngIf="(!isLoading || isFiltering) && especiesPaginadas">
            <th>Nombre de especie</th>
            <th>Fecha de creación</th>
            <th>Acciones</th>
          </tr>
        </ng-template>
      </thead>

      <tbody>

        <ng-container *ngIf="isLoading; else filasDatos">
          <tr *ngFor="let _ of skeletonRows">
            <td><p-skeleton height="1.5rem" width="100%"></p-skeleton></td>
            <td><p-skeleton height="1.5rem" width="100%"></p-skeleton></td>
            <td><p-skeleton height="1.5rem" width="100%"></p-skeleton></td>
          </tr>
        </ng-container>

        <ng-template #filasDatos>
          <tr *ngFor="let especie of especiesPaginadas">
            <td>{{ especie.especie }}</td>
            <td>{{ especie.fechaCreacion }}</td>
            <td>
              <app-btn-editar (clickEvent)="openModal(especie)"></app-btn-editar>
              <app-btn-eliminar (clickEvent)="deleteSpecies(especie.id)"></app-btn-eliminar>
            </td>
          </tr>
        </ng-template>

      </tbody>
    </table>
  </div>

  <app-paginador [data]="especies" (dataPaginadaChange)="onPageChange($event)"></app-paginador>
  
  <app-modal *ngIf="showModal" [show]="showModal" [title]="especieSeleccionada ? 'Editar especie' : 'Agregar especie'"
    (closed)="closeModal()">

    <app-especie-form [especie]="especieSeleccionada" (guardado)="onSave()" (cancelar)="closeModal()">
    </app-especie-form>

  </app-modal>
