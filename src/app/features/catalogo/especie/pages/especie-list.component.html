<div class="container mt-4">
  <h1 class="mb-4 text-center">Lista de Especies</h1>

  <div class="d-flex align-items-center justify-content-between mb-3">

    <div class="d-flex justify-content-between" style="min-width: 180px; margin-left: 150px;">
      <app-btn-agregar (click)="openModal()"></app-btn-agregar>
    </div>

    <div *ngIf="!isLoading && isFiltering || especies.length !== 0"
      class="d-flex flex-wrap align-items-center justify-content-center gap-2 flex-grow-1">

      <div class="flex-grow-1" style="min-width: 250px; max-width: 350px; margin-right: 20px;">
        <app-filtro-busqueda [searchControl]="searchControl" (clear)="clearSearch()" placeholder="Buscar especie...">
        </app-filtro-busqueda>
      </div>

      <div>
        <app-btn-limpiar (click)="clearSearch()"></app-btn-limpiar>
      </div>

      <div *ngIf="!errorMessage" class="d-flex justify-content-end" style="min-width: 180px;">
        <app-filtro-orden [data]="especies" textField="especie" dateField="fechaCreacion"
          (sortedData)="especies = $event">
        </app-filtro-orden>
      </div>

    </div>
  </div>

  <div *ngIf="!isLoading && especies.length === 0 && !errorMessage" class="alert alert-info text-center mx-auto mt-3"
    style="width: 50%;"> No existen especies registradas
  </div>

  <div class="table-container">
    <ng-container *ngIf="especies.length > 0 && !errorMessage; else errorBlock">
      <table>

        <thead>
          <ng-container *ngIf="isLoading && !isFiltering; else columnas">
            <tr>
              <th *ngFor="let _ of columns">
                <div class="skeleton-header"></div>
              </th>
            </tr>
          </ng-container>

          <ng-template #columnas>
            <tr *ngIf="(!isLoading || isFiltering) && especiesPaginadas">
              <th>Nombre de especie</th>
              <th>Fecha de creación</th>
              <th>Acciones</th>
            </tr>
          </ng-template>
        </thead>

        <tbody>
          <ng-container *ngIf="isLoading; else filas">
            <tr *ngFor="let _ of skeletonRows">
              <td *ngFor="let _ of columns">
                <div class="skeleton-body"></div>
              </td>
            </tr>
          </ng-container>

          <ng-template #filas>
            <tr *ngFor="let especie of especiesPaginadas">
              <td>{{ especie.especie }}</td>
              <td>{{ especie.fechaCreacion }}</td>
              <td>
                <app-btn-editar (clickEvent)="openModal(especie)"></app-btn-editar>
                <app-btn-eliminar (clickEvent)="deleteSpecies(especie.id)"></app-btn-eliminar>
              </td>
            </tr>
          </ng-template>

        </tbody>
      </table>
    </ng-container>

    <ng-template #errorBlock>
      <div *ngIf="!isLoading && errorMessage" class="alert alert-danger text-center mx-auto mt-2" style="width: 50%;">
        {{ errorMessage }}
      </div>
    </ng-template>
  </div>

  <app-paginador [data]="especies" (paginatedDataChange)="onPageChange($event)"></app-paginador>
</div>

<app-modal *ngIf="showModal" [show]="showModal" [title]="especieSeleccionada ? 'Editar especie' : 'Agregar especie'"
  (closed)="closeModal()">

  <app-especie-form [especie]="especieSeleccionada" (guardado)="onSave()" (cancelar)="closeModal()">
  </app-especie-form>

</app-modal>
