<div class="login-container">
  <h2>Login</h2>
  <form (ngSubmit)="ingresar()">
    <div>
      <label>Usuario:</label>
      <input type="text" name="usuario" />
    </div>
    <div>
      <label>Contraseña:</label>
      <input type="password" name="password" />
    </div>
    <button type="submit">Ingresar</button>
  </form>
</div>
