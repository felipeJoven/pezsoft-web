<div *ngIf="data?.length" class="mt-3 text-center">

  <div class="text-muted small">
    Página {{ paginaActual }} de {{ paginasTotales }} — Total registros: {{ data.length }}
  </div>

  <div class="d-flex align-items-center gap-1">
    <button class="btn btn-sm btn-outline-secondary" (click)="firstPage()" [disabled]="paginaActual===1">«</button>
    <button class="btn btn-sm btn-outline-secondary" (click)="prevPage()" [disabled]="paginaActual===1">‹</button>

    <button *ngFor="let page of paginasVisibles" class="btn btn-sm"
      [ngClass]="{'btn-primary': page===paginaActual, 'btn-outline-secondary': page!==paginaActual}"
      (click)="cambiarPagina(page)">
      {{ page }}
    </button>

    <button class="btn btn-sm btn-outline-secondary" (click)="nextPage()"
      [disabled]="paginaActual===paginasTotales">›</button>
    <button class="btn btn-sm btn-outline-secondary" (click)="lastPage()"
      [disabled]="paginaActual===paginasTotales">»</button>
  </div>
</div>

<div class="d-flex justify-content-end align-items-center mb-2 flex-wrap gap-2">
  <div>
    <label>Mostrar:
      <select (change)="cambiarItemsPorPagina($event)" class="form-select form-select-sm d-inline-block"
        style="width: auto;">
        <option *ngFor="let opt of opciones" [value]="opt">{{ opt }}</option>
      </select>
    </label>
  </div>

</div>
